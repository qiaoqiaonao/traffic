server:
  port: 8080
  servlet:
    context-path: /

# Python推理服务地址
ai:
  service:
    url: http://localhost:8000

# 日志
logging:
  level:
    com.traffic: DEBUG
    com.baomidou.mybatisplus: DEBUG

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/traffic_analysis?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: o1385769h  # 修改为你的密码
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  # redis配置
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 5000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0


# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.traffic.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境打印SQL
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted  # 逻辑删除字段

# 文件存储配置（关键修复：确保缩进正确）
storage:
  upload-dir: ./uploads
  temp-dir: D:/traffic_project/results

# 异步线程池配置
async:
  core-pool-size: 2
  max-pool-size: 4
  queue-capacity: 100

# 任务完整结果 JSON 在 Redis 中的过期时间（小时），与开题报告「Redis 缓存」一致
traffic:
  cache:
    task-result-ttl-hours: 168