# =============================================================================
# TrafficAI Backend Configuration
# =============================================================================

# ---- Server ----
server:
  port: 8080
  servlet:
    context-path: /

# ---- AI Service Connection ----
ai:
  service:
    url: http://localhost:8000
    polling:
      base-delay-ms: 2000
      max-delay-ms: 10000
      max-attempts: 300
      max-consecutive-errors: 5
      circuit-cooldown-seconds: 30

# ---- Logging ----
# 日志配置已迁移到 logback-spring.xml
# 如需调整，请修改 logback-spring.xml

# ---- Database ----
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/traffic_analysis?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:o1385769h}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # File upload
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

  # Redis
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 1000
    connect-timeout: 1000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# ---- MyBatis-Plus ----
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.traffic.entity
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

# ---- File Storage ----
storage:
  upload-dir: ./uploads
  temp-dir: D:/traffic_project/results

# ---- Async Thread Pool ----
async:
  core-pool-size: 2
  max-pool-size: 4
  queue-capacity: 100

# ---- Traffic Analysis Settings ----
traffic:
  cache:
    task-result-ttl-hours: 168
  auth:
    token-ttl-hours: 24
  analysis:
    max-image-size-mb: 10
    max-video-size-mb: 1024
    allowed-image-formats: jpg,jpeg,png,bmp,webp
    allowed-video-formats: mp4,avi,mov,mkv
  pagination:
    max-limit: 100
  violation:
    speed-limit-kmh: 60
    parking-time-sec: 30
    congestion-vehicle-count: 5
    meters-per-pixel: 0.05
